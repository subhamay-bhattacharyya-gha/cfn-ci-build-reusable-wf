name: CloudFormation CI Build Workflow
description: Deploy CloudFormation stacks with support for reuse across workflows

on:
  workflow_call:
    inputs:
      aws-region:
        description: AWS region
        required: true
        type: string
      aws-account-id:
        description: AWS account ID
        required: true
        type: string
      oidc-role-name:
        description: AWS OIDC role name for authentication
        required: true
        type: string
      cfn-templates-s3-bucket:
        description: S3 bucket name for CloudFormation nested templates
        required: true
        type: string
      stack-name:
        description: CloudFormation stack name
        required: true
        type: string
      template-file:
        description: Path to CloudFormation template file
        required: true
        type: string
      parameters-file:
        description: Path to CloudFormation parameters file
        required: true
        type: string

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  generate-stack-suffix:
    name: Generate Stack Suffix
    runs-on: ubuntu-latest
    outputs:
      suffix: ${{ steps.generate.outputs.suffix }}
    steps:
      - name: Generate random suffix
        id: generate
        run: |
          SUFFIX=$(openssl rand -hex 5 | cut -c1-10)
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          echo "Generated suffix: $SUFFIX"

      - name: Print Inputs and CI Suffix to Summary
        if: vars.PRINT_DEBUG_INFO == 'true'
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🔍 CloudFormation CI Build - Debug Info

          ### Workflow Inputs
          | Parameter | Value |
          |-----------|-------|
          | AWS Region | ${{ inputs.aws-region }} |
          | AWS Account ID | ${{ inputs.aws-account-id }} |
          | OIDC Role Name | ${{ inputs.oidc-role-name }} |
          | S3 Bucket | ${{ inputs.cfn-templates-s3-bucket }} |
          | Stack Name (Base) | ${{ inputs.stack-name }} |
          | Template File | ${{ inputs.template-file }} |
          | Parameters File | ${{ inputs.parameters-file }} |

          ### Generated CI Suffix
          ```
          ${{ steps.generate.outputs.suffix }}
          ```

          ### Final Stack Name
          ```
          ${{ inputs.stack-name }}-${{ steps.generate.outputs.suffix }}
          ```
          EOF

  deploy-cloudformation-stack:
    name: Deploy CloudFormation Stack
    needs: generate-stack-suffix
    uses: subhamay-bhattacharyya-gha/cfn-deploy-wf/.github/workflows/cfn-deploy.yaml@feature/GHA-0016-upgrade-cfn-deploy-action
    with:
      environment: ci
      concurrency-group: ${{ github.workflow }}-ci
      aws-region: ${{ inputs.aws-region }}
      aws-account-id: ${{ inputs.aws-account-id }}
      oidc-role-name: ${{ inputs.oidc-role-name }}
      cfn-templates-s3-bucket: ${{ inputs.cfn-templates-s3-bucket }}
      stack-name: ${{ inputs.stack-name }}-${{ needs.generate-stack-suffix.outputs.suffix }}
      parameters-file: ${{ inputs.parameters-file }}
      template-file: ${{ inputs.template-file }}

  delete-cloudformation-stack:
    name: Delete CloudFormation Stack
    needs: [generate-stack-suffix, deploy-cloudformation-stack]
    uses: subhamay-bhattacharyya-gha/cfn-delete-wf/.github/workflows/cfn-delete.yaml@feature/GHA-0001-initial-release-cloudform
    with:
      environment: ci
      concurrency-group: ${{ github.workflow }}-ci
      aws-region: ${{ inputs.aws-region }}
      aws-account-id: ${{ inputs.aws-account-id }}
      oidc-role-name: ${{ inputs.oidc-role-name }}
      stack-name: ${{ inputs.stack-name }}-${{ needs.generate-stack-suffix.outputs.suffix }}
